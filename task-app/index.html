<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Controle de Tarefas</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3347;--accent:#6366f1;--text:#e8eaf0;--muted:#8a93b2;--danger:#f43f5e;--success:#22c55e;--warn:#f59e0b;--info:#38bdf8}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(26,29,39,.97);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.brand strong{display:block;font-size:15px} .brand small{color:var(--muted);font-size:10px}
main{max-width:1080px;margin:auto;padding:14px}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.btn{border:0;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700} .primary{background:var(--accent);color:#fff} .ghost{background:transparent;color:var(--text);border:1px solid var(--border)} .danger{background:#f43f5e18;color:#fb7185;border:1px solid #f43f5e33} .success{background:#22c55e18;color:#4ade80;border:1px solid #22c55e33}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:12px} .stat,.panel,.task{background:var(--surface);border:1px solid var(--border);border-radius:12px} .stat{padding:12px} .stat span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase} .stat b{font-size:24px}
.filters{padding:10px;display:grid;grid-template-columns:1fr 180px 210px;gap:8px;margin-bottom:11px}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px;outline:none} input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.task{margin:9px 0;overflow:hidden} .task-main{padding:14px} .badges{display:flex;gap:6px;flex-wrap:wrap} .badge{font-size:10px;padding:3px 8px;border-radius:99px;background:#6366f119;color:#c7d2fe} .task h3{margin:8px 0 3px;font-size:15px} .muted{color:var(--muted);font-size:11px}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0} .meta div{background:var(--surface2);border-radius:8px;padding:8px} .meta b{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;margin-bottom:3px} .meta span{font-size:12px}
.obs{background:#12151e;border-radius:8px;padding:9px;font-size:12px;color:#c4c8d6;margin-bottom:10px;white-space:pre-wrap} .actions{display:flex;gap:7px;flex-wrap:wrap}
.subtasks{background:#141722;border-top:1px solid var(--border);padding:12px 14px} .sub-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px} .subrow{display:grid;grid-template-columns:1fr 105px 145px auto;gap:7px;align-items:center;padding:8px 0;border-top:1px solid #252a3b} .subrow.done{opacity:.55} .subrow.done .desc{text-decoration:line-through}
.empty{padding:36px;text-align:center;color:var(--muted)}
dialog{width:min(560px,calc(100% - 20px));max-height:92vh;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px} dialog::backdrop{background:#0009}
form{display:grid;grid-template-columns:1fr 1fr;gap:11px} form h2,form .wide,form .form-actions{grid-column:1/-1} label{font-size:10px;color:var(--muted)} label input,label select,label textarea{margin-top:4px} .form-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:5px}
#toast{position:fixed;right:14px;bottom:14px;z-index:50;background:#202538;border:1px solid var(--success);border-radius:9px;padding:10px 12px;font-size:12px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none} #toast.show{opacity:1;transform:none} #toast.err{border-color:var(--danger);color:#fda4af}
@media(max-width:720px){main{padding:10px} .stats{grid-template-columns:repeat(2,1fr)} .stats .stat:first-child{grid-column:1/-1} .filters{grid-template-columns:1fr} .meta{grid-template-columns:1fr 1fr} .subrow{grid-template-columns:1fr auto} .subrow .sm-hide{display:none} form{grid-template-columns:1fr} form h2,form .wide,form .form-actions{grid-column:auto}}
</style>
</head>
<body>
<header>
  <div class="brand"><strong>✓ Controle de Tarefas</strong><small id="sync">Conectando ao banco...</small></div>
  <button class="btn primary" id="newBtn">+ Nova tarefa</button>
</header>
<main>
  <section id="stats" class="stats"></section>
  <section class="filters panel">
    <input id="search" type="search" placeholder="Buscar tarefa, responsável, solicitante...">
    <select id="filterStatus"><option value="">Todos os status</option><option>Pendente</option><option>Em andamento</option><option>Concluído</option><option>Cancelado</option></select>
    <select id="filterCat"></select>
  </section>
  <section id="list"></section>
</main>

<dialog id="taskDialog">
<form id="taskForm">
  <h2 id="taskTitle">Nova tarefa</h2>
  <input id="taskId" type="hidden">
  <label>Categoria *<select id="categoria" required></select></label>
  <label>Status *<select id="status" required><option>Pendente</option><option>Em andamento</option><option>Concluído</option><option>Cancelado</option></select></label>
  <label class="wide">Nome da tarefa *<input id="nome" required></label>
  <label>Solicitante *<input id="solicitante" required></label>
  <label>Responsáveis *<input id="responsaveis" required></label>
  <label>Prazo<input id="prazo" type="date"></label>
  <label class="wide">Observações<textarea id="obs" rows="3"></textarea></label>
  <div class="form-actions"><button type="button" class="btn ghost" id="cancelTask">Cancelar</button><button type="submit" class="btn primary">Salvar</button></div>
</form>
</dialog>

<dialog id="actionDialog">
<form id="actionForm">
  <h2>Nova ação</h2>
  <input id="actionTaskId" type="hidden">
  <label class="wide">Descrição *<input id="actionDesc" required></label>
  <label>Prazo<input id="actionPrazo" type="date"></label>
  <label>Responsável<input id="actionResp"></label>
  <div class="form-actions"><button type="button" class="btn ghost" id="cancelAction">Cancelar</button><button type="submit" class="btn primary">Adicionar</button></div>
</form>
</dialog>
<div id="toast"></div>
<script>
const API="https://ep-autumn-heart-aepwnqo2.apirest.c-2.us-east-2.aws.neon.tech/neondb/rest/v1";
const TOKEN="eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InRhc2stYXBwLWtleS0xIn0.eyJzdWIiOiJzaGFyZWQtdGFzay1hcHAiLCJyb2xlIjoiYXV0aGVudGljYXRlZCIsImlhdCI6MTc4NzkyMzk2OSwiZXhwIjoxOTQ1NjA0MDI5fQ.N02ax4cz8ZpndqICfTALm4qb-7vUe3UzwzggNTW9vMFehvoCjz_58s6Jsc-GzXc2n9qyv-7HVKpbVq6IYXvXjYr8Hf_Rs06gbzzNy70_yKbTxm8Aifg2MvGIMqYo2d0l_RCyoAO1vZ4pT1Ur-sEBSWnRfVO0QZaCQqhWrXW-kKWlDb3_03BkyYQHt2V-0-gSJjCNhq5vZcV8nUcIIdTI7zPuX5VYC6x_I82k7dIyrO2a8Zk0D6HdGSbvIqnnyuT52I3GibYrGLaE7vMLUAHIlZqahXy9PHBZhVtm9GJ7M7bIzG7gs_xIQjwvyhS48F9D7PIr-zukzPSoGG9ysKkjIg";
const CATS=['Documento','Questionário','Auditoria','Não Conformidade','Plano de Ação','Plano de Mudança','Lançamento de Despesa','Treinamento'];
let tasks=[], expanded=new Set();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const headers=(extra={})=>({'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json',...extra});
async function rest(path,opts={}){
  const r=await fetch(API+path,{...opts,headers:headers(opts.headers||{})});
  if(!r.ok){let m='Erro ao acessar o banco';try{const j=await r.json();m=j.message||j.error||m}catch{}throw new Error(m)}
  if(r.status===204)return null; const txt=await r.text(); return txt?JSON.parse(txt):null;
}
function init(){
  $('categoria').innerHTML='<option value="">Selecione...</option>'+CATS.map(x=>`<option>${esc(x)}</option>`).join('');
  $('filterCat').innerHTML='<option value="">Todas as categorias</option>'+CATS.map(x=>`<option>${esc(x)}</option>`).join('');
}
async function load(){
  $('sync').textContent='Sincronizando...';
  try{
    const data=await rest('/tasks?select=*,mini_actions(*)&order=prazo.asc.nullslast,created_at.desc');
    tasks=(data||[]).map(t=>({...t,miniAcoes:(t.mini_actions||[]).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''))}));
    $('sync').textContent='Sincronizado • '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    render();
  }catch(e){$('sync').textContent='Falha na sincronização';toast(e.message,true)}
}
function render(){
  const today=new Date().toISOString().slice(0,10);
  const s={total:tasks.length,p:tasks.filter(t=>t.status==='Pendente').length,a:tasks.filter(t=>t.status==='Em andamento').length,c:tasks.filter(t=>t.status==='Concluído').length,l:tasks.filter(t=>t.prazo&&t.prazo<today&&!['Concluído','Cancelado'].includes(t.status)).length};
  $('stats').innerHTML=[['Total',s.total],['Pendentes',s.p],['Em andamento',s.a],['Concluídas',s.c],['Atrasadas',s.l]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
  const q=$('search').value.toLowerCase(),fs=$('filterStatus').value,fc=$('filterCat').value;
  const data=tasks.filter(t=>(!q||[t.nome,t.solicitante,t.responsaveis,t.categoria,t.obs].join(' ').toLowerCase().includes(q))&&(!fs||t.status===fs)&&(!fc||t.categoria===fc));
  $('list').innerHTML=data.length?data.map(card).join(''):'<div class="panel empty">Nenhuma tarefa encontrada.</div>';
}
function card(t){
  const done=t.miniAcoes.filter(a=>Number(a.concluida)===1).length;
  return `<article class="task"><div class="task-main"><div class="badges"><span class="badge">${esc(t.categoria)}</span><span class="badge">${esc(t.status)}</span></div><h3>${esc(t.nome)}</h3><div class="muted">${done}/${t.miniAcoes.length} ações concluídas</div><div class="meta"><div><b>Solicitante</b><span>${esc(t.solicitante)}</span></div><div><b>Responsáveis</b><span>${esc(t.responsaveis)}</span></div><div><b>Prazo</b><span>${fmt(t.prazo)}</span></div><div><b>Ações</b><span>${done}/${t.miniAcoes.length}</span></div></div>${t.obs?`<div class="obs">${esc(t.obs)}</div>`:''}<div class="actions"><button class="btn ghost" onclick="toggleTask('${t.id}')">${expanded.has(t.id)?'Ocultar ações':'Ver ações'}</button><button class="btn ghost" onclick="editTask('${t.id}')">Editar</button><button class="btn danger" onclick="deleteTask('${t.id}')">Excluir</button></div></div>${expanded.has(t.id)?subs(t):''}</article>`;
}
function subs(t){
  return `<div class="subtasks"><div class="sub-head"><strong>Mini ações</strong><button class="btn primary" onclick="newAction('${t.id}')">+ Nova ação</button></div>${t.miniAcoes.length?t.miniAcoes.map(a=>`<div class="subrow ${Number(a.concluida)===1?'done':''}"><span class="desc">${esc(a.descricao)}</span><span class="sm-hide muted">${fmt(a.prazo)}</span><span class="sm-hide muted">${esc(a.responsavel||'—')}</span><span><button class="btn ${Number(a.concluida)===1?'ghost':'success'}" onclick="toggleAction('${a.id}',${Number(a.concluida)===1?0:1})">${Number(a.concluida)===1?'Reabrir':'Concluir'}</button> <button class="btn danger" onclick="deleteAction('${a.id}')">×</button></span></div>`).join(''):'<div class="muted">Nenhuma ação cadastrada.</div>'}</div>`;
}
function fmt(s){if(!s)return'—';const[y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function toast(msg,err=false){const e=$('toast');e.textContent=msg;e.className=err?'show err':'show';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2500)}
$('newBtn').onclick=()=>{$('taskForm').reset();$('taskId').value='';$('status').value='Pendente';$('taskTitle').textContent='Nova tarefa';$('taskDialog').showModal()};
$('cancelTask').onclick=()=>$('taskDialog').close(); $('cancelAction').onclick=()=>$('actionDialog').close();
$('taskForm').onsubmit=async e=>{e.preventDefault();const id=$('taskId').value,now=new Date().toISOString(),obj={categoria:$('categoria').value,nome:$('nome').value.trim(),solicitante:$('solicitante').value.trim(),responsaveis:$('responsaveis').value.trim(),prazo:$('prazo').value,status:$('status').value,obs:$('obs').value.trim(),updated_at:now};try{if(id)await rest('/tasks?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(obj)});else await rest('/tasks',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({id:crypto.randomUUID(),...obj,created_at:now})});$('taskDialog').close();toast(id?'Tarefa atualizada':'Tarefa criada');await load()}catch(x){toast(x.message,true)}};
$('actionForm').onsubmit=async e=>{e.preventDefault();const taskId=$('actionTaskId').value,now=new Date().toISOString();try{await rest('/mini_actions',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({id:crypto.randomUUID(),task_id:taskId,descricao:$('actionDesc').value.trim(),prazo:$('actionPrazo').value,responsavel:$('actionResp').value.trim(),concluida:0,created_at:now,updated_at:now})});$('actionDialog').close();expanded.add(taskId);toast('Ação adicionada');await load()}catch(x){toast(x.message,true)}};
for(const id of['search','filterStatus','filterCat'])$(id).addEventListener(id==='search'?'input':'change',render);
window.toggleTask=id=>{expanded.has(id)?expanded.delete(id):expanded.add(id);render()};
window.editTask=id=>{const t=tasks.find(x=>x.id===id);if(!t)return;$('taskId').value=t.id;$('categoria').value=t.categoria;$('nome').value=t.nome;$('solicitante').value=t.solicitante;$('responsaveis').value=t.responsaveis;$('prazo').value=t.prazo||'';$('status').value=t.status;$('obs').value=t.obs||'';$('taskTitle').textContent='Editar tarefa';$('taskDialog').showModal()};
window.deleteTask=async id=>{if(!confirm('Excluir esta tarefa e todas as ações?'))return;try{await rest('/tasks?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{'Prefer':'return=minimal'}});toast('Tarefa excluída');await load()}catch(x){toast(x.message,true)}};
window.newAction=id=>{$('actionForm').reset();$('actionTaskId').value=id;$('actionDialog').showModal()};
window.toggleAction=async(id,v)=>{try{await rest('/mini_actions?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({concluida:v,updated_at:new Date().toISOString()})});await load()}catch(x){toast(x.message,true)}};
window.deleteAction=async id=>{if(!confirm('Excluir esta ação?'))return;try{await rest('/mini_actions?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{'Prefer':'return=minimal'}});await load()}catch(x){toast(x.message,true)}};
const AUTO_SYNC_INTERVAL_MS=5000;
let autoSyncBusy=false;
function normalizeTasks(data){
  return (data||[]).map(t=>({...t,miniAcoes:(t.mini_actions||[]).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''))}));
}
function syncSignature(list){
  return JSON.stringify((list||[]).map(t=>[t.id,t.updated_at,(t.miniAcoes||[]).map(a=>[a.id,a.updated_at,a.concluida])]));
}
async function autoSync(){
  if(autoSyncBusy||document.hidden||$('taskDialog').open||$('actionDialog').open)return;
  autoSyncBusy=true;
  try{
    const data=await rest('/tasks?select=*,mini_actions(*)&order=prazo.asc.nullslast,created_at.desc');
    const next=normalizeTasks(data);
    const changed=syncSignature(next)!==syncSignature(tasks);
    if(changed){
      tasks=next;
      render();
      toast('Atualização recebida de outro dispositivo');
    }
    $('sync').textContent='Sincronizado automaticamente • '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    $('sync').textContent=navigator.onLine?'Falha na sincronização':'Sem conexão';
  }finally{autoSyncBusy=false}
}
setInterval(autoSync,AUTO_SYNC_INTERVAL_MS);
window.addEventListener('focus',autoSync);
window.addEventListener('online',autoSync);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoSync()});
init();load();
</script>

<!-- TASK_INSIGHTS_V1 -->
<style>
.insight-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:16px 0 8px}.insight-title h2{font-size:14px;margin:0}.insight-title p{font-size:10px;color:var(--muted);margin:2px 0 0}.productivity{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:linear-gradient(180deg,#1b1f2c,#181b26);border:1px solid var(--border);border-radius:12px;padding:14px}.metric span{color:var(--muted);font-size:10px;text-transform:uppercase}.metric b{display:block;font-size:28px;margin-top:2px}.metric small{color:var(--muted)}.metric-filter{display:flex;gap:8px;align-items:center}.metric-filter select{width:auto;min-width:190px}.history-filters{padding:10px;display:grid;grid-template-columns:1fr 150px 180px 180px;gap:8px;margin-bottom:10px}.history-list{display:grid;gap:8px}.history-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 12px;display:grid;grid-template-columns:150px 1fr 140px;gap:10px;align-items:start}.history-item .when{font-size:11px;color:var(--muted)}.history-item strong{font-size:12px}.history-item .details{font-size:10px;color:var(--muted);margin-top:3px}.history-item .who{text-align:right;font-size:10px;color:var(--muted)}.lesson-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.lesson{background:#12151e;border-radius:8px;padding:9px;font-size:12px;color:#c4c8d6;white-space:pre-wrap}.lesson b{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;margin-bottom:5px}.field-note{grid-column:1/-1;background:#11141c;border:1px solid var(--border);border-radius:10px;padding:10px}.field-note strong{font-size:11px}.field-note p{font-size:10px;color:var(--muted);margin:3px 0 0}.date-range{padding:10px;display:grid;grid-template-columns:180px 180px auto 1fr;gap:8px;align-items:end;margin-bottom:10px}.date-range label span{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.date-range-actions{display:flex;gap:7px;align-items:end}.date-range small{color:var(--muted);font-size:10px;align-self:center}@media(max-width:720px){.date-range{grid-template-columns:1fr}.date-range-actions{width:100%}.date-range-actions .btn{flex:1}.productivity{grid-template-columns:1fr}.metric-filter{width:100%}.metric-filter select{width:100%;min-width:0}.insight-title{align-items:stretch;flex-direction:column}.history-filters{grid-template-columns:1fr}.history-item{grid-template-columns:1fr}.history-item .who{text-align:left}.lesson-grid{grid-template-columns:1fr}.field-note{grid-column:auto}}
</style>
<script>
(()=>{
  let taskHistory=[];
  const metricSection=document.createElement('section');
  metricSection.innerHTML=`<div class="insight-title"><div><h2>Produtividade concluída</h2><p>Quantidade de demandas finalizadas no período</p></div><div class="metric-filter"><select id="metricCat"></select></div></div><div class="productivity"><div class="metric"><span>Hoje</span><b id="doneToday">0</b><small>demandas concluídas</small></div><div class="metric"><span>Esta semana</span><b id="doneWeek">0</b><small>demandas concluídas</small></div><div class="metric"><span>Este mês</span><b id="doneMonth">0</b><small>demandas concluídas</small></div></div>`;
  $('stats').after(metricSection);

  const historySection=document.createElement('section');
  historySection.innerHTML=`<div class="insight-title"><div><h2>Histórico do que foi feito</h2><p>Registro das movimentações, ações e demandas</p></div></div><div class="history-filters panel"><input id="historySearch" type="search" placeholder="Buscar demanda, evento ou responsável..."><select id="historyPeriod"><option value="today">Hoje</option><option value="week">Esta semana</option><option value="month" selected>Este mês</option><option value="all">Todo o histórico</option></select><select id="historyEvent"><option value="">Todos os eventos</option><option>Demanda criada</option><option>Demanda atualizada</option><option>Demanda concluída</option><option>Status alterado</option><option>Demanda excluída</option><option>Ação criada</option><option>Ação concluída</option><option>Ação reaberta</option><option>Ação excluída</option></select><select id="historyCat"></select></div><div class="date-range panel"><label><span>Data inicial</span><input id="historyDateFrom" type="date"></label><label><span>Data final</span><input id="historyDateTo" type="date"></label><div class="date-range-actions"><button type="button" class="btn ghost" id="historyTodayBtn">Hoje</button><button type="button" class="btn ghost" id="clearHistoryDates">Limpar datas</button></div><small>Selecione uma única data ou informe data inicial e final para filtrar por intervalo.</small></div><div id="historyList" class="history-list"></div>`;
  $('list').after(historySection);

  const formActions=$('taskForm').querySelector('.form-actions');
  const lessons=document.createElement('div');
  lessons.className='wide';
  lessons.innerHTML=`<div class="field-note"><strong>Registro de aprendizado da demanda</strong><p>Documente o contexto para facilitar consultas futuras.</p></div><label class="wide">Desafios<textarea id="desafios" rows="2" placeholder="O que tornou esta demanda mais difícil?"></textarea></label><label class="wide">Problemas<textarea id="problemas" rows="2" placeholder="Quais problemas ocorreram?"></textarea></label><label class="wide">Soluções<textarea id="solucoes" rows="2" placeholder="Como foi resolvido ou qual solução foi aplicada?"></textarea></label>`;
  formActions.before(lessons);

  const catOptions=CATS.map(x=>`<option>${esc(x)}</option>`).join('');
  $('metricCat').innerHTML='<option value="">Todas as categorias</option>'+catOptions;
  $('historyCat').innerHTML='<option value="">Todas as categorias</option>'+catOptions;

  function parseInsightDate(v){if(!v)return null;const d=new Date(v);return Number.isNaN(d.getTime())?null:d}
  function insightToday(){const d=new Date();d.setHours(0,0,0,0);return d}
  function insightWeek(){const d=insightToday(),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d}
  function insightMonth(){const d=insightToday();d.setDate(1);return d}
  function insightDateTime(v){const d=parseInsightDate(v);return d?d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}

  function renderProductivity(){
    const fc=$('metricCat').value;
    const completed=tasks.filter(t=>t.status==='Concluído'&&t.concluido_at&&(!fc||t.categoria===fc));
    const countFrom=start=>completed.filter(t=>{const d=parseInsightDate(t.concluido_at);return d&&d>=start}).length;
    $('doneToday').textContent=countFrom(insightToday());
    $('doneWeek').textContent=countFrom(insightWeek());
    $('doneMonth').textContent=countFrom(insightMonth());
  }

  function historyStart(period){if(period==='today')return insightToday();if(period==='week')return insightWeek();if(period==='month')return insightMonth();return null}
  function localDateStart(value){if(!value)return null;const [y,m,d]=value.split('-').map(Number);return new Date(y,m-1,d,0,0,0,0)}
  function localDateEnd(value){if(!value)return null;const [y,m,d]=value.split('-').map(Number);return new Date(y,m-1,d,23,59,59,999)}
  function historyBounds(){
    const from=$('historyDateFrom').value,to=$('historyDateTo').value,period=$('historyPeriod').value;
    if(from&&to){const a=localDateStart(from),b=localDateEnd(to);return a<=b?{start:a,end:b}:{start:localDateStart(to),end:localDateEnd(from)}}
    if(from){return {start:localDateStart(from),end:localDateEnd(from)}}
    if(to){return {start:localDateStart(to),end:localDateEnd(to)}}
    return {start:historyStart(period),end:null};
  }
  function renderTaskHistory(){
    const q=$('historySearch').value.toLowerCase(),event=$('historyEvent').value,cat=$('historyCat').value,{start,end}=historyBounds();
    const data=taskHistory.filter(h=>{const d=parseInsightDate(h.occurred_at);return(!start||d&&d>=start)&&(!end||d&&d<=end)&&(!event||h.evento===event)&&(!cat||h.categoria===cat)&&(!q||[h.demanda,h.evento,h.detalhes,h.responsavel,h.categoria].join(' ').toLowerCase().includes(q))});
    $('historyList').innerHTML=data.length?data.map(h=>`<article class="history-item"><div class="when">${insightDateTime(h.occurred_at)}</div><div><div class="badges"><span class="badge">${esc(h.categoria||'Sem categoria')}</span><span class="badge">${esc(h.evento)}</span></div><strong>${esc(h.demanda||'Demanda removida')}</strong><div class="details">${esc(h.detalhes||'')}</div></div><div class="who">${h.responsavel?'Responsável: '+esc(h.responsavel):''}</div></article>`).join(''):'<div class="panel empty">Nenhum registro encontrado neste período.</div>';
  }

  async function loadTaskHistory(silent=true){
    try{taskHistory=await rest('/task_history?select=*&order=occurred_at.desc&limit=500')||[];renderTaskHistory()}catch(e){if(!silent)toast(e.message,true)}
  }
  async function writeTaskHistory({task_id,demanda,categoria,evento,detalhes='',responsavel=''}){
    await rest('/task_history',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({task_id,demanda,categoria,evento,detalhes,responsavel})});
  }

  const originalRender=render;
  render=function(){
    const today=new Date().toISOString().slice(0,10);
    const s={total:tasks.length,p:tasks.filter(t=>t.status==='Pendente').length,a:tasks.filter(t=>t.status==='Em andamento').length,c:tasks.filter(t=>t.status==='Concluído').length,l:tasks.filter(t=>t.prazo&&t.prazo<today&&!['Concluído','Cancelado'].includes(t.status)).length};
    $('stats').innerHTML=[['Total',s.total],['Pendentes',s.p],['Em andamento',s.a],['Concluídas',s.c],['Atrasadas',s.l]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
    const q=$('search').value.toLowerCase(),fs=$('filterStatus').value,fc=$('filterCat').value;
    const data=tasks.filter(t=>(!q||[t.nome,t.solicitante,t.responsaveis,t.categoria,t.obs,t.desafios,t.problemas,t.solucoes].join(' ').toLowerCase().includes(q))&&(!fs||t.status===fs)&&(!fc||t.categoria===fc));
    $('list').innerHTML=data.length?data.map(card).join(''):'<div class="panel empty">Nenhuma tarefa encontrada.</div>';
    renderProductivity();renderTaskHistory();
  };

  card=function(t){
    const done=t.miniAcoes.filter(a=>Number(a.concluida)===1).length;
    const lessons=[t.desafios?`<div class="lesson"><b>Desafios</b>${esc(t.desafios)}</div>`:'',t.problemas?`<div class="lesson"><b>Problemas</b>${esc(t.problemas)}</div>`:'',t.solucoes?`<div class="lesson"><b>Soluções</b>${esc(t.solucoes)}</div>`:''].filter(Boolean).join('');
    return `<article class="task"><div class="task-main"><div class="badges"><span class="badge">${esc(t.categoria)}</span><span class="badge">${esc(t.status)}</span></div><h3>${esc(t.nome)}</h3><div class="muted">${done}/${t.miniAcoes.length} ações concluídas${t.concluido_at?' • concluída em '+insightDateTime(t.concluido_at):''}</div><div class="meta"><div><b>Solicitante</b><span>${esc(t.solicitante)}</span></div><div><b>Responsáveis</b><span>${esc(t.responsaveis)}</span></div><div><b>Prazo</b><span>${fmt(t.prazo)}</span></div><div><b>Ações</b><span>${done}/${t.miniAcoes.length}</span></div></div>${t.obs?`<div class="obs">${esc(t.obs)}</div>`:''}${lessons?`<div class="lesson-grid">${lessons}</div>`:''}<div class="actions"><button class="btn ghost" onclick="toggleTask('${t.id}')">${expanded.has(t.id)?'Ocultar ações':'Ver ações'}</button><button class="btn ghost" onclick="editTask('${t.id}')">Editar</button><button class="btn danger" onclick="deleteTask('${t.id}')">Excluir</button></div></div>${expanded.has(t.id)?subs(t):''}</article>`;
  };

  window.editTask=id=>{const t=tasks.find(x=>x.id===id);if(!t)return;$('taskId').value=t.id;$('categoria').value=t.categoria;$('nome').value=t.nome;$('solicitante').value=t.solicitante;$('responsaveis').value=t.responsaveis;$('prazo').value=t.prazo||'';$('status').value=t.status;$('obs').value=t.obs||'';$('desafios').value=t.desafios||'';$('problemas').value=t.problemas||'';$('solucoes').value=t.solucoes||'';$('taskTitle').textContent='Editar tarefa';$('taskDialog').showModal()};

  $('taskForm').onsubmit=async e=>{
    e.preventDefault();const id=$('taskId').value,previous=id?tasks.find(x=>x.id===id):null,now=new Date().toISOString(),status=$('status').value;let concluido_at=previous?.concluido_at||null;if(status==='Concluído'&&previous?.status!=='Concluído')concluido_at=now;if(status!=='Concluído')concluido_at=null;
    const obj={categoria:$('categoria').value,nome:$('nome').value.trim(),solicitante:$('solicitante').value.trim(),responsaveis:$('responsaveis').value.trim(),prazo:$('prazo').value,status,obs:$('obs').value.trim(),desafios:$('desafios').value.trim(),problemas:$('problemas').value.trim(),solucoes:$('solucoes').value.trim(),concluido_at,updated_at:now};
    try{if(id){await rest('/tasks?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(obj)});let evento='Demanda atualizada',detalhes='Dados da demanda foram atualizados';if(previous.status!==status){evento=status==='Concluído'?'Demanda concluída':'Status alterado';detalhes=`${previous.status} → ${status}`}else if(previous.desafios!==obj.desafios||previous.problemas!==obj.problemas||previous.solucoes!==obj.solucoes){detalhes='Desafios, problemas ou soluções foram atualizados'}await writeTaskHistory({task_id:id,demanda:obj.nome,categoria:obj.categoria,evento,detalhes,responsavel:obj.responsaveis});toast(evento)}else{const newId=crypto.randomUUID();await rest('/tasks',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({id:newId,...obj,created_at:now})});await writeTaskHistory({task_id:newId,demanda:obj.nome,categoria:obj.categoria,evento:'Demanda criada',detalhes:`Status inicial: ${status}`,responsavel:obj.responsaveis});if(status==='Concluído')await writeTaskHistory({task_id:newId,demanda:obj.nome,categoria:obj.categoria,evento:'Demanda concluída',detalhes:'Criada já como concluída',responsavel:obj.responsaveis});toast('Demanda criada')}$('taskDialog').close();await load();await loadTaskHistory()}catch(x){toast(x.message,true)}};

  $('actionForm').onsubmit=async e=>{e.preventDefault();const taskId=$('actionTaskId').value,task=tasks.find(t=>t.id===taskId),now=new Date().toISOString(),desc=$('actionDesc').value.trim(),resp=$('actionResp').value.trim();try{await rest('/mini_actions',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({id:crypto.randomUUID(),task_id:taskId,descricao:desc,prazo:$('actionPrazo').value,responsavel:resp,concluida:0,created_at:now,updated_at:now})});await writeTaskHistory({task_id:taskId,demanda:task?.nome||'',categoria:task?.categoria||'',evento:'Ação criada',detalhes:desc,responsavel:resp||task?.responsaveis||''});$('actionDialog').close();expanded.add(taskId);toast('Ação adicionada');await load();await loadTaskHistory()}catch(x){toast(x.message,true)}};

  window.deleteTask=async id=>{if(!confirm('Excluir esta tarefa e todas as ações?'))return;const t=tasks.find(x=>x.id===id);try{await writeTaskHistory({task_id:id,demanda:t?.nome||'',categoria:t?.categoria||'',evento:'Demanda excluída',detalhes:'A demanda e suas ações foram excluídas',responsavel:t?.responsaveis||''});await rest('/tasks?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{'Prefer':'return=minimal'}});toast('Demanda excluída');await load();await loadTaskHistory()}catch(x){toast(x.message,true)}};
  window.toggleAction=async(id,v)=>{const task=tasks.find(t=>t.miniAcoes.some(a=>a.id===id)),a=task?.miniAcoes.find(x=>x.id===id);try{await rest('/mini_actions?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({concluida:v,updated_at:new Date().toISOString()})});await writeTaskHistory({task_id:task?.id||'',demanda:task?.nome||'',categoria:task?.categoria||'',evento:v?'Ação concluída':'Ação reaberta',detalhes:a?.descricao||'',responsavel:a?.responsavel||task?.responsaveis||''});await load();await loadTaskHistory()}catch(x){toast(x.message,true)}};
  window.deleteAction=async id=>{if(!confirm('Excluir esta ação?'))return;const task=tasks.find(t=>t.miniAcoes.some(a=>a.id===id)),a=task?.miniAcoes.find(x=>x.id===id);try{await writeTaskHistory({task_id:task?.id||'',demanda:task?.nome||'',categoria:task?.categoria||'',evento:'Ação excluída',detalhes:a?.descricao||'',responsavel:a?.responsavel||task?.responsaveis||''});await rest('/mini_actions?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{'Prefer':'return=minimal'}});await load();await loadTaskHistory()}catch(x){toast(x.message,true)}};

  $('metricCat').addEventListener('change',renderProductivity);for(const id of['historySearch','historyPeriod','historyEvent','historyCat'])$(id).addEventListener(id==='historySearch'?'input':'change',renderTaskHistory);
  for(const id of['historyDateFrom','historyDateTo'])$(id).addEventListener('change',()=>{$('historyPeriod').value='all';renderTaskHistory()});
  $('historyTodayBtn').addEventListener('click',()=>{const d=new Date(),v=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');$('historyDateFrom').value=v;$('historyDateTo').value='';$('historyPeriod').value='all';renderTaskHistory()});
  $('clearHistoryDates').addEventListener('click',()=>{$('historyDateFrom').value='';$('historyDateTo').value='';$('historyPeriod').value='month';renderTaskHistory()});
  $('historyPeriod').addEventListener('change',()=>{if($('historyPeriod').value!=='all'||(!$('historyDateFrom').value&&!$('historyDateTo').value)){$('historyDateFrom').value='';$('historyDateTo').value='';renderTaskHistory()}});
  setInterval(()=>{if(!document.hidden&&!$('taskDialog').open&&!$('actionDialog').open)loadTaskHistory()},5000);window.addEventListener('focus',()=>loadTaskHistory());document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadTaskHistory()});
  loadTaskHistory(false);renderProductivity();
})();
</script>

</body></html>
