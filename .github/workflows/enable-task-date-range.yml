name: Enable task date range

on:
  push:
    paths:
      - '.github/workflows/enable-task-date-range.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add date and date range filters
        shell: python
        run: |
          from pathlib import Path
          p=Path('task-app/index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="historyDateFrom"'
          if marker in s:
              print('Date range already enabled')
              raise SystemExit(0)

          old="""<div class=\"history-filters panel\"><input id=\"historySearch\" type=\"search\" placeholder=\"Buscar demanda, evento ou responsável...\"><select id=\"historyPeriod\"><option value=\"today\">Hoje</option><option value=\"week\">Esta semana</option><option value=\"month\" selected>Este mês</option><option value=\"all\">Todo o histórico</option></select><select id=\"historyEvent\"><option value=\"\">Todos os eventos</option>"""
          new="""<div class=\"history-filters panel\"><input id=\"historySearch\" type=\"search\" placeholder=\"Buscar demanda, evento ou responsável...\"><select id=\"historyPeriod\"><option value=\"today\">Hoje</option><option value=\"week\">Esta semana</option><option value=\"month\" selected>Este mês</option><option value=\"all\">Todo o histórico</option></select><select id=\"historyEvent\"><option value=\"\">Todos os eventos</option>"""
          if old not in s:
              raise SystemExit('History filter marker not found')
          s=s.replace(old,new,1)

          old2="""<select id=\"historyCat\"></select></div><div id=\"historyList\" class=\"history-list\"></div>`;"""
          new2="""<select id=\"historyCat\"></select></div><div class=\"date-range panel\"><label><span>Data inicial</span><input id=\"historyDateFrom\" type=\"date\"></label><label><span>Data final</span><input id=\"historyDateTo\" type=\"date\"></label><div class=\"date-range-actions\"><button type=\"button\" class=\"btn ghost\" id=\"historyTodayBtn\">Hoje</button><button type=\"button\" class=\"btn ghost\" id=\"clearHistoryDates\">Limpar datas</button></div><small>Selecione uma única data ou informe data inicial e final para filtrar por intervalo.</small></div><div id=\"historyList\" class=\"history-list\"></div>`;"""
          if old2 not in s:
              raise SystemExit('History section end marker not found')
          s=s.replace(old2,new2,1)

          css_marker=""".field-note strong{font-size:11px}.field-note p{font-size:10px;color:var(--muted);margin:3px 0 0}"""
          css_new=css_marker+""".date-range{padding:10px;display:grid;grid-template-columns:180px 180px auto 1fr;gap:8px;align-items:end;margin-bottom:10px}.date-range label span{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.date-range-actions{display:flex;gap:7px;align-items:end}.date-range small{color:var(--muted);font-size:10px;align-self:center}"""
          if css_marker not in s:
              raise SystemExit('CSS marker not found')
          s=s.replace(css_marker,css_new,1)
          mobile="""@media(max-width:720px){.productivity{grid-template-columns:1fr}"""
          mobile_new="""@media(max-width:720px){.date-range{grid-template-columns:1fr}.date-range-actions{width:100%}.date-range-actions .btn{flex:1}.productivity{grid-template-columns:1fr}"""
          if mobile not in s:
              raise SystemExit('Mobile CSS marker not found')
          s=s.replace(mobile,mobile_new,1)

          old3="""function historyStart(period){if(period==='today')return insightToday();if(period==='week')return insightWeek();if(period==='month')return insightMonth();return null}\n  function renderTaskHistory(){\n    const q=$('historySearch').value.toLowerCase(),period=$('historyPeriod').value,event=$('historyEvent').value,cat=$('historyCat').value,start=historyStart(period);\n    const data=taskHistory.filter(h=>{const d=parseInsightDate(h.occurred_at);return(!start||d&&d>=start)&&(!event||h.evento===event)&&(!cat||h.categoria===cat)&&(!q||[h.demanda,h.evento,h.detalhes,h.responsavel,h.categoria].join(' ').toLowerCase().includes(q))});"""
          new3="""function historyStart(period){if(period==='today')return insightToday();if(period==='week')return insightWeek();if(period==='month')return insightMonth();return null}\n  function localDateStart(value){if(!value)return null;const [y,m,d]=value.split('-').map(Number);return new Date(y,m-1,d,0,0,0,0)}\n  function localDateEnd(value){if(!value)return null;const [y,m,d]=value.split('-').map(Number);return new Date(y,m-1,d,23,59,59,999)}\n  function historyBounds(){\n    const from=$('historyDateFrom').value,to=$('historyDateTo').value,period=$('historyPeriod').value;\n    if(from&&to){const a=localDateStart(from),b=localDateEnd(to);return a<=b?{start:a,end:b}:{start:localDateStart(to),end:localDateEnd(from)}}\n    if(from){return {start:localDateStart(from),end:localDateEnd(from)}}\n    if(to){return {start:localDateStart(to),end:localDateEnd(to)}}\n    return {start:historyStart(period),end:null};\n  }\n  function renderTaskHistory(){\n    const q=$('historySearch').value.toLowerCase(),event=$('historyEvent').value,cat=$('historyCat').value,{start,end}=historyBounds();\n    const data=taskHistory.filter(h=>{const d=parseInsightDate(h.occurred_at);return(!start||d&&d>=start)&&(!end||d&&d<=end)&&(!event||h.evento===event)&&(!cat||h.categoria===cat)&&(!q||[h.demanda,h.evento,h.detalhes,h.responsavel,h.categoria].join(' ').toLowerCase().includes(q))});"""
          if old3 not in s:
              raise SystemExit('History render marker not found')
          s=s.replace(old3,new3,1)

          old4="""for(const id of['historySearch','historyPeriod','historyEvent','historyCat'])$(id).addEventListener(id==='historySearch'?'input':'change',renderTaskHistory);"""
          new4="""for(const id of['historySearch','historyPeriod','historyEvent','historyCat'])$(id).addEventListener(id==='historySearch'?'input':'change',renderTaskHistory);\n  for(const id of['historyDateFrom','historyDateTo'])$(id).addEventListener('change',()=>{$('historyPeriod').value='all';renderTaskHistory()});\n  $('historyTodayBtn').addEventListener('click',()=>{const d=new Date(),v=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');$('historyDateFrom').value=v;$('historyDateTo').value='';$('historyPeriod').value='all';renderTaskHistory()});\n  $('clearHistoryDates').addEventListener('click',()=>{$('historyDateFrom').value='';$('historyDateTo').value='';$('historyPeriod').value='month';renderTaskHistory()});\n  $('historyPeriod').addEventListener('change',()=>{if($('historyPeriod').value!=='all'||(!$('historyDateFrom').value&&!$('historyDateTo').value)){$('historyDateFrom').value='';$('historyDateTo').value='';renderTaskHistory()}});"""
          if old4 not in s:
              raise SystemExit('History listeners marker not found')
          s=s.replace(old4,new4,1)

          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'eplautomacaointeligente'
          git config user.email 'epl.automacaointeligente@hotmail.com'
          git add task-app/index.html
          git commit -m 'Adiciona calendário e intervalo de datas ao histórico'
          git push origin main
