name: Test task app API

on:
  push:
    branches: [main]
    paths:
      - 'task-app/**'
      - '.github/workflows/test-task-app-api.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test authenticated Data API and browser CORS
        env:
          API: https://ep-autumn-heart-aepwnqo2.apirest.c-2.us-east-2.aws.neon.tech/neondb/rest/v1
          TOKEN: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InRhc2stYXBwLWtleS0xIn0.eyJzdWIiOiJzaGFyZWQtdGFzay1hcHAiLCJyb2xlIjoiYXV0aGVudGljYXRlZCIsImlhdCI6MTc4NzkyMzk2OSwiZXhwIjoxOTQ1NjA0MDI5fQ.N02ax4cz8ZpndqICfTALm4qb-7vUe3UzwzggNTW9vMFehvoCjz_58s6Jsc-GzXc2n9qyv-7HVKpbVq6IYXvXjYr8Hf_Rs06gbzzNy70_yKbTxm8Aifg2MvGIMqYo2d0l_RCyoAO1vZ4pT1Ur-sEBSWnRfVO0QZaCQqhWrXW-kKWlDb3_03BkyYQHt2V-0-gSJjCNhq5vZcV8nUcIIdTI7zPuX5VYC6x_I82k7dIyrO2a8Zk0D6HdGSbvIqnnyuT52I3GibYrGLaE7vMLUAHIlZqahXy9PHBZhVtm9GJ7M7bIzG7gs_xIQjwvyhS48F9D7PIr-zukzPSoGG9ysKkjIg
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/body.json -D /tmp/headers.txt -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Origin: https://htmlpreview.github.io" \
            "$API/tasks?select=id&limit=1")
          cat /tmp/headers.txt
          cat /tmp/body.json
          test "$code" = "200"
          preflight=$(curl -sS -o /tmp/options.txt -D /tmp/options-headers.txt -w '%{http_code}' -X OPTIONS \
            -H "Origin: https://htmlpreview.github.io" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: authorization,content-type" \
            "$API/tasks")
          cat /tmp/options-headers.txt
          cat /tmp/options.txt
          test "$preflight" -ge 200
          test "$preflight" -lt 400
