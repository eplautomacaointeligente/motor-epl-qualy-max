name: Restore task table view

on:
  push:
    paths:
      - '.github/workflows/restore-task-table-view.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append compact table visualization
        run: |
          set -euo pipefail
          if grep -q 'TASK_TABLE_VIEW_V1' task-app/index.html; then
            echo 'Table view already enabled'
            exit 0
          fi
          cat task-app/table-view-addon.html >> task-app/index.html
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'eplautomacaointeligente'
          git config user.email 'epl.automacaointeligente@hotmail.com'
          git add task-app/index.html
          git commit -m 'Mantém demandas em visualização tabular compacta'
          git push origin main
